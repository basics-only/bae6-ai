# bae6-ai eval-worker on the bae6-platform `bae6-service` chart. One release serves one organization.
# helm install bae6-ai-eval-worker <bae6-platform checkout>/charts/bae6-service -f deploy/eval-worker.values.yaml \
#   --set image.digest=sha256:...
image:
  repository: ghcr.io/basics-only/bae6-ai-eval-worker

# Replicas share one queue; a run is claimed by exactly one of them.
replicas: 2
autoscaling:
  minReplicas: 2
  maxReplicas: 6

# Drain delay + the 10s hard-stop margin in main.ts; interrupted runs are retried elsewhere.
terminationGracePeriodSeconds: 40

env:
  PORT: "8082"
  BAE6_SHUTDOWN_DELAY_MS: "10000"
  BAE6_AI_GATEWAY_URL: http://bae6-ai-gateway
  BAE6_WORKER_TOKEN_FILE: /var/run/secrets/bae6/token
  BAE6_WORKER_CONCURRENCY: "2"
  BAE6_EVAL_CONCURRENCY: "4"
  BAE6_MAX_CASES: "500"
  BAE6_MAX_UNFINISHED_PER_ORG: "20"
  # pool max x maxReplicas must fit this service's share of Postgres connections.
  BAE6_DB_POOL_MAX: "10"
  BAE6_AI_ISSUERS: >-
    [{"issuer":"https://idp.example.invalid/","audience":"bae6-ai-eval-worker","jwksUri":"https://idp.example.invalid/.well-known/jwks.json","organization":"example","application":"example-app"}]

envFromSecrets:
  - name: BAE6_DATABASE_URL
    secret: bae6-ai-eval-worker
    key: database-url

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

networkPolicy:
  egress:
    # Postgres and the identity provider's JWKS; narrow to their addresses.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 5432
        - port: 443
    # The gateway, in cluster.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bae6-ai-gateway
      ports:
        - port: 8080
