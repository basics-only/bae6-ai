# bae6-ai gateway on the bae6-platform `bae6-service` chart. Postgres is external (ADR-0007).
# helm install bae6-ai-gateway <bae6-platform checkout>/charts/bae6-service -f deploy/values.yaml \
#   --set image.digest=sha256:...
image:
  repository: ghcr.io/basics-only/bae6-ai-gateway

# Three replicas share one ledger; budgets hold across them (02-AI.md acceptance).
replicas: 3
autoscaling:
  minReplicas: 3
  maxReplicas: 10

# Drain delay + provider timeout + the 5s hard-stop margin in main.ts.
terminationGracePeriodSeconds: 80

env:
  BAE6_SHUTDOWN_DELAY_MS: "10000"
  BAE6_PROVIDER_TIMEOUT_MS: "60000"
  BAE6_MAX_INFLIGHT: "64"
  BAE6_MAX_INFLIGHT_PER_ORG: "32"
  # pool max x maxReplicas must fit this service's share of Postgres connections.
  BAE6_DB_POOL_MAX: "10"
  BAE6_AI_ISSUERS: >-
    [{"issuer":"https://idp.example.invalid/","audience":"bae6-ai","jwksUri":"https://idp.example.invalid/.well-known/jwks.json","organization":"example","application":"example-app"}]
  # Changing a price needs a new priceBook version; the gateway refuses to start otherwise.
  BAE6_AI_CONFIG: >-
    {"priceBook":{"version":"2026-11","prices":{"claude-sonnet":{"inputPerMTok":"3","outputPerMTok":"15"}}},
    "models":[{"id":"claude-sonnet","provider":"bedrock","providerModel":"replace-with-bedrock-model-id","region":"us-east-1",
    "operations":["chat","chat_stream"],"inputModalities":["text","image"],"maxInputTokens":200000,"maxOutputTokens":8192}],
    "budgets":{"example":"100"}}

envFromSecrets:
  - name: BAE6_DATABASE_URL
    secret: bae6-ai-gateway
    key: database-url

serviceAccount:
  # Bedrock via EKS Pod Identity needs no annotation; Vertex via GKE Workload Identity:
  # iam.gke.io/gcp-service-account: bae6-ai@<project>.iam.gserviceaccount.com
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

networkPolicy:
  egress:
    # Postgres, provider APIs and the identity provider's JWKS; narrow to their addresses.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 5432
        - port: 443
    # EKS Pod Identity agent and the GKE metadata server.
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - port: 80
